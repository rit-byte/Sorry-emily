<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I'm Sorry Sheetal ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      position: relative;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 10;
      animation: appear 1s ease;
    }

    .heart {
      font-size: 65px;
      animation: heartbeat 1.3s infinite;
      margin-bottom: 15px;
    }

    h1 {
      color: #e63962;
      font-size: 32px;
      margin-bottom: 18px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    #forgiveBtn {
      background: #e63962;
      color: white;
    }

    #angryBtn {
      background: #444;
      color: white;
    }

    button:hover {
      transform: scale(1.08);
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      color: #e63962;
      font-weight: bold;
      min-height: 28px;
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.18);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .sorry-text {
      font-size: 14px;
      color: #999;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="card" id="card">

    <div class="heart">❤️</div>

    <h1>Hey Emily...</h1>

    <p>
      I'm really sorry 🥺<br>
      I know I messed up.<br>
      I didn't mean to hurt you.<br><br>
      Please forgive me ❤️
    </p>

    <div class="buttons">
      <button id="forgiveBtn">Forgive Me ❤️</button>
      <button id="angryBtn">Still Angry 😤</button>
    </div>

    <div id="message"></div>

    <div class="sorry-text">
      I really hope you can forgive me 🥺
    </div>

  </div>


  <script>

    const forgiveBtn = document.getElementById("forgiveBtn");
    const angryBtn = document.getElementById("angryBtn");
    const message = document.getElementById("message");
    const card = document.getElementById("card");

    // Forgive button
    forgiveBtn.addEventListener("click", function() {

      message.innerHTML = "Thank you, Emily 🥺❤️ I promise I'll do better.";

      card.classList.remove("shake");

      createHearts(25);
    });


    // Still Angry button
    angryBtn.addEventListener("click", function() {

      message.innerHTML = "Okay... I'll keep saying sorry 🥺💗";

      // Shake the card
      card.classList.remove("shake");

      // Restart animation
      void card.offsetWidth;

      card.classList.add("shake");

      // Create lots of hearts
      createHearts(15);

      // Change button text
      angryBtn.innerHTML = "Still Angry? 😭";

    });


    // Create floating hearts
    function createHearts(amount) {

      for (let i = 0; i < amount; i++) {

        const heart = document.createElement("div");

        heart.classList.add("floating-heart");

        heart.innerHTML = ["❤️", "💗", "💕", "💖", "🥺"][Math.floor(Math.random() * 5)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDuration =
          (3 + Math.random() * 3) + "s";

        heart.style.fontSize =
          (18 + Math.random() * 25) + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }
    }

  </script>

</body>
</html>
